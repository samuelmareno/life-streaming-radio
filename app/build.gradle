plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.injilkeselamatan.lifestreamingradio'
    compileSdk = 37

    defaultConfig {
        applicationId = "com.injilkeselamatan.lifestreamingradio"
        minSdk = 23
        targetSdk = 37
        versionCode = 2
        versionName = "2.1.0"
        buildConfigField("String", "RADIO_URL", RADIO_URL)
        buildConfigField("String", "NOWPLAYING_URL", NOWPLAYING_URL)
        buildConfigField("String", "CAST_RECEIVER_APP_ID", CAST_RECEIVER_APP_ID)

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    packaging {
        jniLibs {
            // Dukungan halaman memori 16 KB (wajib Android 15+): native library
            // dikemas tanpa kompresi sehingga AGP meng-align-nya ke 16 KB.
            useLegacyPackaging = false
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'

    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-session:1.11.1'
    implementation 'androidx.media3:media3-cast:1.11.1'
    // Dideklarasikan eksplisit: di media3-cast hanya berscope runtime, padahal
    // MediaRouteButton dipakai langsung di layout.
    implementation 'androidx.mediarouter:mediarouter:1.8.1'

    implementation 'com.github.bumptech.glide:glide:5.0.9'

    // In-app update support
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.play:app-update-ktx:2.1.0'

    testImplementation 'junit:junit:4.13.2'
    // org.json bawaan Android hanya stub di unit test lokal.
    testImplementation 'org.json:json:20260814'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
